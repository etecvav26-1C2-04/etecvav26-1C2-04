<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0a3c"/>
      <stop offset="45%" stop-color="#150a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="896" height="296" rx="18"/>
    </clipPath>

    <style>
      .node-a, .node-b, .node-c {
        animation-name: twinkle;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }

      .circuit-group {
        animation: drift 10s ease-in-out infinite;
        transform-origin: 450px 150px;
      }
      @keyframes drift {
        0%, 100% { transform: translate(0px,0px); }
        50% { transform: translate(3px,-3px); }
      }

      .glowspot {
        animation: pulse 6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.25); opacity: 1; }
      }

      .sweep {
        animation: sweepMove 5s linear infinite;
      }
      @keyframes sweepMove {
        0% { transform: translateX(-900px); }
        100% { transform: translateX(900px); }
      }

      .cursor {
        opacity: 0;
        animation: blink 0.9s steps(1) infinite;
        animation-delay: 1.50s;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .subtitle {
        opacity: 0;
        animation: fadeUp 0.9s ease-out forwards;
        animation-delay: 1.70s;
      }
      .badge {
        opacity: 0;
        animation: fadeUp 0.8s ease-out forwards;
        animation-delay: 2.30s;
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0px); }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="296" rx="18" fill="url(#bgGrad)"/>

